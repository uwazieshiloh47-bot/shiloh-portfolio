name: Live smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * *"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PORTFOLIO_URL: ${{ vars.PORTFOLIO_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install production test browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Check the deployed portfolio
        run: npm run test:smoke

      - name: Upload failure trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
