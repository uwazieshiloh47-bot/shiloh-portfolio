name: Deploy portfolio to AWS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "styles.css"
      - "visitor-counter.js"
      - "icon_PORTFOLIO.png"
      - "robots.txt"
      - "sitemap.xml"
      - "social-preview.png"
      - "social-work.png"
      - "social-skills.png"
      - "social-resume.png"
      - "social-about.png"
      - "social-contact.png"
      - "scripts/social-cards.mjs"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - "seo.test.mjs"
      - "accessibility.test.mjs"
      - "performance.test.mjs"
      - "smoke/**"
      - "documents/Shiloh-Uwazie-Resume.pdf"
      - "fonts/PlayfairDisplay-Regular.woff2"
      - "fonts/PlayfairDisplay-Italic.woff2"
      - "fonts/PlayfairDisplay-OFL.txt"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: portfolio-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      PORTFOLIO_URL: ${{ vars.PORTFOLIO_URL }}
      S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          for variable_name in \
            AWS_REGION \
            AWS_ROLE_ARN \
            CLOUDFRONT_DISTRIBUTION_ID \
            PORTFOLIO_URL \
            S3_BUCKET_NAME
          do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "Missing required repository variable: ${variable_name}" >&2
              exit 1
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Install production test browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # Deliberately before the upload. The live smoke test further down checks
      # the same thing, but only after the files are already in S3 and served -
      # which is how a homepage that scrolled sideways on phones reached
      # visitors. This one runs against a local server, so a layout regression
      # fails the deploy instead of shipping and then reporting itself.
      #
      # It needs the browsers above, so it cannot move up into `npm run check`,
      # which also runs in CI where none are installed.
      - name: Check layout at every breakpoint
        run: npm run test:layout

      - name: Build deployment package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist/documents dist/fonts

          cp \
            404.html \
            about.html \
            contact.html \
            icon_PORTFOLIO.png \
            index.html \
            resume.html \
            robots.txt \
            sitemap.xml \
            social-preview.png \
            social-work.png \
            social-skills.png \
            social-resume.png \
            social-about.png \
            social-contact.png \
            skills.html \
            styles.css \
            visitor-counter.js \
            work.html \
            dist/

          cp documents/Shiloh-Uwazie-Resume.pdf dist/documents/
          cp fonts/PlayfairDisplay-Regular.woff2 dist/fonts/
          cp fonts/PlayfairDisplay-Italic.woff2 dist/fonts/

          # The OFL requires its text to travel with the font, and serving a
          # face to a browser is redistribution, so the licence ships too.
          cp fonts/PlayfairDisplay-OFL.txt dist/fonts/

          # This guard only catches a file that stopped copying, not one that was
          # never listed - the copies above are an allowlist. Anything added to
          # fonts/ has to be named here, in the paths trigger, in an upload_group
          # and in an assert_object_metadata call, or it silently never deploys.
          file_count="$(find dist -type f | wc -l)"
          if [[ "${file_count}" -ne 22 ]]; then
            echo "Expected 22 deployment files, found ${file_count}." >&2
            exit 1
          fi

          find dist -type f -print | sort

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: GitHubActionsPortfolioDeploy

      - name: Confirm AWS identity
        run: aws sts get-caller-identity

      - name: Upload portfolio to S3
        shell: bash
        run: |
          set -euo pipefail

          aws s3 sync \
            dist/ \
            "s3://${S3_BUCKET_NAME}/" \
            --delete

          HTML_CACHE_CONTROL="public, max-age=0, s-maxage=300, must-revalidate"

          # CSS and JS revalidate in the browser on every load, same as the HTML.
          #
          # They used to sit at max-age=3600, and because the HTML revalidates
          # immediately, that opened an hour-long window after every deploy where
          # a returning visitor got new markup with the previous stylesheet. It
          # is not theoretical: the Gilded release moved the starfield from a
          # body class to a body pseudo-element, and for anyone mid-window the
          # markup no longer carried the class the cached CSS was keyed to, so
          # the background silently vanished.
          #
          # s-maxage keeps CloudFront serving these from the edge for a year and
          # the invalidation step below handles freshness, so the only added cost
          # is one conditional request per load that answers 304. Note there is
          # deliberately no stale-while-revalidate here - it would let a browser
          # keep using the old file while it refetched, which is the exact
          # behaviour this is meant to remove.
          CODE_CACHE_CONTROL="public, max-age=0, s-maxage=31536000, must-revalidate"

          ASSET_CACHE_CONTROL="public, max-age=604800, s-maxage=31536000, stale-while-revalidate=2592000"

          upload_group() {
            local pattern="$1"
            local cache_control="$2"
            local content_type="$3"

            aws s3 cp \
              dist/ \
              "s3://${S3_BUCKET_NAME}/" \
              --recursive \
              --exclude "*" \
              --include "${pattern}" \
              --cache-control "${cache_control}" \
              --content-type "${content_type}"
          }

          upload_group "*.html" "${HTML_CACHE_CONTROL}" "text/html; charset=utf-8"
          upload_group "*.txt" "${HTML_CACHE_CONTROL}" "text/plain; charset=utf-8"
          upload_group "*.xml" "${HTML_CACHE_CONTROL}" "application/xml; charset=utf-8"
          upload_group "*.css" "${CODE_CACHE_CONTROL}" "text/css; charset=utf-8"
          upload_group "*.js" "${CODE_CACHE_CONTROL}" "text/javascript; charset=utf-8"
          upload_group "*.png" "${ASSET_CACHE_CONTROL}" "image/png"
          upload_group "*.pdf" "${ASSET_CACHE_CONTROL}" "application/pdf"

          # Without this group the woff2 files keep whatever type the sync step
          # guessed - usually binary/octet-stream, which browsers refuse to parse
          # as a font. The page still renders, silently, in the fallback serif.
          upload_group "*.woff2" "${ASSET_CACHE_CONTROL}" "font/woff2"

          assert_object_metadata() {
            local key="$1"
            local expected_content_type="$2"
            local expected_cache_control="$3"
            local actual_content_type
            local actual_cache_control

            actual_content_type="$(aws s3api head-object \
              --bucket "${S3_BUCKET_NAME}" \
              --key "${key}" \
              --query ContentType \
              --output text)"
            actual_cache_control="$(aws s3api head-object \
              --bucket "${S3_BUCKET_NAME}" \
              --key "${key}" \
              --query CacheControl \
              --output text)"

            if [[ "${actual_content_type}" != "${expected_content_type}" ]]; then
              echo "${key} has unexpected Content-Type: ${actual_content_type}" >&2
              exit 1
            fi

            if [[ "${actual_cache_control}" != "${expected_cache_control}" ]]; then
              echo "${key} has unexpected Cache-Control: ${actual_cache_control}" >&2
              exit 1
            fi
          }

          assert_object_metadata "index.html" "text/html; charset=utf-8" "${HTML_CACHE_CONTROL}"
          assert_object_metadata "robots.txt" "text/plain; charset=utf-8" "${HTML_CACHE_CONTROL}"
          assert_object_metadata "sitemap.xml" "application/xml; charset=utf-8" "${HTML_CACHE_CONTROL}"
          assert_object_metadata "styles.css" "text/css; charset=utf-8" "${CODE_CACHE_CONTROL}"
          assert_object_metadata "visitor-counter.js" "text/javascript; charset=utf-8" "${CODE_CACHE_CONTROL}"
          assert_object_metadata "social-preview.png" "image/png" "${ASSET_CACHE_CONTROL}"
          assert_object_metadata "social-work.png" "image/png" "${ASSET_CACHE_CONTROL}"
          assert_object_metadata "documents/Shiloh-Uwazie-Resume.pdf" "application/pdf" "${ASSET_CACHE_CONTROL}"
          assert_object_metadata "fonts/PlayfairDisplay-Regular.woff2" "font/woff2" "${ASSET_CACHE_CONTROL}"
          assert_object_metadata "fonts/PlayfairDisplay-Italic.woff2" "font/woff2" "${ASSET_CACHE_CONTROL}"

      - name: Invalidate CloudFront cache
        id: invalidate
        shell: bash
        run: |
          set -euo pipefail

          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*" \
            --query "Invalidation.Id" \
            --output text)"

          echo "invalidation_id=${invalidation_id}" >> "${GITHUB_OUTPUT}"

      - name: Wait for CloudFront invalidation
        run: |
          aws cloudfront wait invalidation-completed \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --id "${{ steps.invalidate.outputs.invalidation_id }}"

      - name: Run live smoke test
        run: npm run test:smoke

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-smoke-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
